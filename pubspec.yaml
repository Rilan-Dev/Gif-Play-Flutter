name: gif_play
description: "For My Love"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

# APK CI compatibility: drift_flutter 0.3.x pairs with drift 2.32.x.
# Android build tooling: Gradle 8.14.3 + AGP 8.11.1 + Kotlin 2.2.20.
# Consider running flutter pub outdated before upgrading dependencies.

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.6
  http: ^1.1.0
  crypto: ^3.0.6
  drift: ^2.32.1
  drift_flutter: ^0.3.1
  html: ^0.15.4
  dartz: ^0.10.1
  cached_network_image: ^3.2.3
  share_plus: ^7.0.2
  lottie: ^2.6.0
  flutter_staggered_animations: ^1.1.1

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  provider: ^6.1.4
  shared_preferences: ^2.5.3
  animated_splash_screen: ^1.3.0
  page_transition: ^2.2.1
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.3
  rename_app: ^1.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
