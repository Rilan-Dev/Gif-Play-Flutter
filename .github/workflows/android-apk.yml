name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choose which APK to build"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
  # Temporary troubleshooting trigger: remove after a successful APK is produced.
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ${{ inputs.build_type || 'release' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build selected APK
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          case "$BUILD_TYPE" in
            debug|release) flutter build apk "--$BUILD_TYPE" ;;
            *) echo "Unsupported build type: $BUILD_TYPE" >&2; exit 1 ;;
          esac

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gif-play-${{ inputs.build_type || 'release' }}-android-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-${{ inputs.build_type || 'release' }}.apk
          if-no-files-found: error
          retention-days: 30
